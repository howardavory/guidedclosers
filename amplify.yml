version: 1
frontend:
  phases:
    preBuild:
      commands:
        - rm -rf node_modules/.prisma
        - rm -rf node_modules/@prisma/client
        - npm ci
    build:
      commands:
        - echo "DATABASE_URL=$DATABASE_URL" >> .env
        - npx prisma generate
        - npx prisma db push --accept-data-loss
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
